<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Halaman Tidak Ditemukan</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #030712; }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col items-center justify-center p-6 select-none">
  <div class="max-w-md w-full text-center space-y-5 bg-slate-900/60 border border-slate-800/80 p-8 rounded-3xl shadow-2xl backdrop-blur-sm">
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-rose-500/10 text-rose-500 text-4xl font-black border border-rose-500/20 shadow-inner">
      404
    </div>
    <div class="space-y-2">
      <h1 class="text-xl font-bold text-white tracking-tight">Halaman Tidak Ditemukan</h1>
      <p class="text-xs text-slate-400 leading-relaxed">
        Endpoint atau berkas ini telah dinonaktifkan, dipindahkan, atau tidak tersedia untuk publik demi kebijakan keamanan sistem.
      </p>
    </div>
    <div class="pt-2">
      <a href="index.html" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold transition border border-slate-700/60 shadow">
        &larr; Kembali ke Halaman Utama
      </a>
    </div>
    <div class="text-[10px] text-slate-600 font-mono pt-4 border-t border-slate-800/60">
      HTTP Error 404 - Resource Not Available
    </div>
  </div>
</body>
</html>
