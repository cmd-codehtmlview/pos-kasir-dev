# HTTP Redirect to HTTPS
server {
    listen 80;
    server_name 2.27.165.72 2.27.165.72.sslip.io;
    return 301 https://2.27.165.72.sslip.io$request_uri;
}

# HTTPS Server (Full SSL support for camera & PWA)
server {
    listen 443 ssl;
    server_name 2.27.165.72 2.27.165.72.sslip.io;

    ssl_certificate /etc/letsencrypt/live/2.27.165.72.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2.27.165.72.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/pos-kasir/public_html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # 1. Jalur Khusus Development / Staging (/dev/)
    location = /dev {
        return 301 https://$host/dev/;
    }

    location ^~ /dev/ {
        alias /var/www/pos-kasir-dev/public_html/;
        index index.html;
        try_files $uri $uri/ /dev/index.html;

        # Disable browser cache on dev for seamless live testing
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Service Worker khusus jalur dev
    location = /dev/sw.js {
        alias /var/www/pos-kasir-dev/public_html/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Service-Worker-Allowed "/dev/";
        expires 0;
    }

    # 2. Melayani Front-end Statis Produksi (Toko)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Service Worker PWA (No-cache agar auto-update)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # 3. Proxy API Service (Node.js Express port 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 4. Proxy Supabase REST & API Gateway (port 8000)
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Inject apikey default jika client belum mengirim header apikey
        proxy_set_header apikey "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg5ODUwNDE4LCJleHAiOjE5NDc1MzA0MTh9.99BRNnUQwei95p1zAqtFBBD5CnUJSedfUeh2MJy97Gg";
        proxy_set_header Authorization "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg5ODUwNDE4LCJleHAiOjE5NDc1MzA0MTh9.99BRNnUQwei95p1zAqtFBBD5CnUJSedfUeh2MJy97Gg";

        # Hilangkan header WWW-Authenticate agar browser tidak memunculkan popup login bawaan
        proxy_hide_header WWW-Authenticate;
    }

    location /auth/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header WWW-Authenticate;
    }

    location /storage/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header WWW-Authenticate;
    }
}
